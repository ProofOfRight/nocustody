# SPDX-License-Identifier: Apache-2.0
# Updates are proposed weekly and always reviewed manually (docs/adr/0007-minimal-dependencies.md).
# One grouped pull request per ecosystem and week instead of one per dependency. A version is proposed only after
# it has been published for a week: most hijacked package versions are pulled within days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Pinned to 6.0.x until dependency-cruiser supports TypeScript 7 (docs/adr/0022-typescript-run-mode.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      docker-compose:
        patterns: ["*"]
  # Base image of the production Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      docker:
        patterns: ["*"]
