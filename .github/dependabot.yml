# SPDX-License-Identifier: Apache-2.0
# Updates are proposed weekly and always reviewed manually (docs/adr/0007-minimal-dependencies.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Pinned to 6.0.x until dependency-cruiser supports TypeScript 7 (docs/adr/0022-typescript-run-mode.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule: { interval: weekly }
  # Base image of the production Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
