# SPDX-License-Identifier: Apache-2.0
# Release on a version tag: full CI, multi-arch image to GHCR, signed SLSA provenance and SBOM attestations,
# GitHub release. See docs/releasing.md and docs/adr/0029-release-provenance.md.
# Third-party actions are pinned by commit SHA; Docker is driven through the CLI preinstalled on the runner.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Three jobs so that the one able to sign (id-token) runs no repository code, npm or BuildKit (SLSA build L3,
  # isolated signing; docs/adr/0033-release-isolated-signing.md): build pushes the image and produces the SBOM,
  # attest signs exactly that digest and SBOM, publish creates the GitHub release.
  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Maintainers can require an approval for this environment in the repository settings. Every later job needs
    # this one, so the approval gates the whole release.
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # to prove the tagged commit is on main

      - name: Tag matches package.json; reproducible build inputs
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version package.json)" = "$version" ] || { echo "tag $GITHUB_REF_NAME != package.json"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "VERSION=$version"
            echo "IMAGE=$image"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          } >> "$GITHUB_ENV"
          { echo "version=$version"; echo "image=$image"; } >> "$GITHUB_OUTPUT"

      - name: The tagged commit is on main, and nothing was published under this version yet
        # A tag can be pushed on any commit (no PR, no code-owner review) and an existing tag can be re-pushed;
        # neither may produce a validly attested image under a released version.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"; exit 1
          fi
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "image $IMAGE:$VERSION already exists"; exit 1
          fi

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        run: |
          docker buildx create --use --name release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          # BuildKit's own (unsigned) attestations are off: provenance and SBOM are attested and signed by the attest
          # job, and the image digest stays reproducible from the source.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_DATE_EPOCH --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=false --sbom=false \
            --output "type=image,name=$IMAGE:$VERSION,push=true,rewrite-timestamp=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "unexpected digest: $digest"; exit 1; }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the pushed image (the digest operators deploy, not a separate build)
        run: sh scripts/smoke-image.sh "$IMAGE@$DIGEST"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      - name: SBOM of the image contents (SPDX)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/sbom.ts > "nocustody-$VERSION.spdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: nocustody-${{ steps.meta.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No checkout, no npm, no BuildKit: only GitHub's own actions and the runner's docker CLI run here.
    permissions:
      packages: write # attach the attestations to the image in ghcr.io
      id-token: write # short-lived Sigstore certificate for the attestations
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Attest build provenance of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest the SBOM for the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: nocustody-${{ env.VERSION }}.spdx.json
          push-to-registry: true

  publish:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # GitHub release
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the release notes come from CHANGELOG.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ## Image

          \`$IMAGE:$VERSION@$DIGEST\` (linux/amd64, linux/arm64)

          Verify before deploying (docs/deployment.md#verify-the-image):

          \`\`\`
          gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "nocustody $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "nocustody-$VERSION.spdx.json"
